# infra/nginx/voce-br.conf — reverse proxy legado *.smartecm.io (descomissionar após redirects).
# Canônico luure: ver luure-ledger-api.conf (ledger/api) e Vercel (*.luure.com.br portais).
# O certbot --nginx injeta os blocos SSL (listen 443) automaticamente.

# Hub estadual Luure
server {
    listen 80;
    server_name voce.smartecm.io;
    location / {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# API backend (FastAPI) — inclui SSE em /ledger/stream
server {
    listen 80;
    server_name api.smartecm.io;
    location / {
        proxy_pass http://localhost:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE — sem buffer e sem timeout para eventos em tempo real
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}

# Ledger Indy (von-network)
server {
    listen 80;
    server_name ledger.smartecm.io;
    location / {
        proxy_pass http://localhost:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

