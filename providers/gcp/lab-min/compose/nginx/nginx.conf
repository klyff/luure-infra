worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 128;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 30;
  server_tokens off;

  server {
    listen 80;
    server_name _;

    location = /genesis {
      proxy_pass http://von-network:8000/genesis;
    }

    location / {
      proxy_pass http://von-network:8000;
    }
  }

  server {
    listen 6543;
    server_name _;

    location / {
      proxy_pass http://tails-server:6543;
    }
  }
}
